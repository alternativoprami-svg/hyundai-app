name: hyundai_app
description: "App para propietarios de vehículos Hyundai (2016-actualidad): fichas técnicas, testigos del tablero, mantenimiento y decodificador VIN."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Estado de la app (fase de lógica)
  provider: ^6.1.2

  # Persistencia local para recordatorios de mantenimiento
  shared_preferences: ^2.2.3

  # Visor de PDF para manuales de usuario
  flutter_pdfview: ^1.3.2

  # Notificaciones locales para recordatorios de mantenimiento
  flutter_local_notifications: ^17.2.2

  # Formato de fechas (útil para mantenimiento programado)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/models/
    - assets/images/warning_lights/
    - assets/manuals/
