workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
